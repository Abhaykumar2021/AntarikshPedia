<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AntarikshPedia — A Connected History of Space Exploration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1>AntarikshPedia</h1>
    <p class="tagline">A connected encyclopedia of humanity's journey into space</p>
  </header>

  <!-- Filter bar: filled in by main.js once data loads -->
  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <!-- Country/agency filter buttons get added here by JavaScript -->
  </div>

  <!-- The timeline itself: main.js fills this container with mission cards -->
  <main id="timeline-container">
    <p id="loading-message">Loading missions...</p>
  </main>

  <footer class="site-footer">
    <p>AntarikshPedia — built and maintained by Abhay Kumar.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
